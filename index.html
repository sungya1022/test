<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱的语言测试 · 你真正需要的爱，是哪一种？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #fdf6f3;
    color: #2b2124;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    pointer-events: none;
  }
  .blob-1 { width: 460px; height: 460px; background: #ffd9e2; top: -170px; left: -130px; opacity: .9; }
  .blob-2 { width: 440px; height: 440px; background: #ffe6cd; bottom: -190px; right: -130px; opacity: .85; }
  .blob-3 { width: 360px; height: 360px; background: #e6dcfa; top: 32%; right: 6%; opacity: .55; }

  .app { position: relative; z-index: 1; width: 100%; max-width: 640px; }

  .screen { display: none; }
  .screen.active {
    display: block;
    animation: fadeUp .55s cubic-bezier(.22,.8,.3,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 30px;
    padding: 48px 44px;
    box-shadow: 0 30px 70px -30px rgba(150, 90, 110, .35),
                0 2px 8px rgba(150, 90, 110, .06);
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: .22em;
    color: #c98d9c;
    font-weight: 600;
    margin-bottom: 20px;
  }

  h1 {
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    font-size: 38px;
    line-height: 1.42;
    font-weight: 700;
    letter-spacing: .01em;
    margin: 0 0 22px;
  }

  .hl {
    background: linear-gradient(180deg, transparent 64%, #ffd0dc 64%);
    color: #d2607a;
    padding: 0 3px;
  }

  .lead {
    font-size: 16px;
    line-height: 1.95;
    color: #6d5b61;
    margin: 0 0 36px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 17px 34px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ef8ba0, #e0687f 55%, #d9586f);
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .08em;
    cursor: pointer;
    box-shadow: 0 14px 30px -12px rgba(224, 104, 127, .9);
    transition: transform .22s cubic-bezier(.22,.8,.3,1), box-shadow .22s;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 22px 40px -14px rgba(224, 104, 127, 1);
  }
  .btn-primary:active { transform: translateY(0) scale(.99); }

  .meta {
    margin-top: 20px;
    font-size: 13px;
    color: #a8979d;
    text-align: center;
    letter-spacing: .03em;
  }

  .credit {
    text-align: center;
    font-size: 12px;
    color: #bcacb2;
    margin: 18px 0 0;
    letter-spacing: .05em;
  }

  .quiz-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 38px;
  }

  .back-btn {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    border-radius: 50%;
    border: 1px solid #f0e3e6;
    background: #fff;
    color: #a08c92;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all .2s;
    font-family: inherit;
  }
  .back-btn:hover { border-color: #eec3ce; color: #d2607a; background: #fff7f9; }

  .progress {
    flex: 1;
    height: 6px;
    background: #f4e8ea;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #f5b083, #e0687f);
    transition: width .45s cubic-bezier(.22,.8,.3,1);
  }

  .counter {
    font-size: 13px;
    color: #ab989e;
    font-variant-numeric: tabular-nums;
    min-width: 54px;
    text-align: right;
    letter-spacing: .05em;
  }

  #stage.anim { animation: fadeUp .38s cubic-bezier(.22,.8,.3,1) both; }

  .q-text {
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.6;
    letter-spacing: .01em;
    margin: 0 0 26px;
    color: #2b2124;
  }

  .options { display: flex; flex-direction: column; gap: 14px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    width: 100%;
    padding: 20px 22px;
    text-align: left;
    background: #fff;
    border: 1.5px solid #f2e6e9;
    border-radius: 18px;
    font-family: inherit;
    font-size: 15.5px;
    line-height: 1.65;
    color: #3a2e32;
    cursor: pointer;
    transition: all .22s cubic-bezier(.22,.8,.3,1);
  }
  .option:hover {
    border-color: #f0b9c6;
    background: #fffafb;
    transform: translateY(-3px);
    box-shadow: 0 18px 30px -20px rgba(200, 110, 135, .95);
  }
  .option.picked {
    border-color: #e0687f;
    background: #fff3f6;
    transform: scale(.985);
    box-shadow: 0 0 0 3px rgba(224,104,127,.12);
  }

  .opt-key {
    flex: 0 0 26px;
    height: 26px;
    border-radius: 50%;
    background: #fdeef2;
    color: #cf7189;
    font-size: 12px;
    font-weight: 700;
    display: grid;
    place-items: center;
    margin-top: 1px;
    transition: all .22s;
  }
  .option:hover .opt-key,
  .option.picked .opt-key { background: #e0687f; color: #fff; }

  .opt-text { flex: 1; }

  .result-hero { text-align: center; margin-bottom: 26px; }

  .result-icon {
    width: 88px;
    height: 88px;
    margin: 0 auto 24px;
    border-radius: 30px;
    display: grid;
    place-items: center;
    font-size: 40px;
    background: #fdeef2;
    box-shadow: 0 18px 34px -18px rgba(224,104,127,.9);
    transition: background .4s;
  }

  .result-hero .eyebrow { margin-bottom: 12px; }

  .result-hero h2 {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 33px;
    font-weight: 700;
    letter-spacing: .03em;
    margin: 0 0 10px;
  }

  .result-en {
    font-size: 11px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: #bda9af;
  }

  .tagline {
    margin: 18px 0 0;
    font-size: 15px;
    color: #8a757c;
    letter-spacing: .02em;
  }

  .result-desc {
    font-size: 15.5px;
    line-height: 2.05;
    color: #5c4c52;
    margin: 0 0 24px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .chip {
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 999px;
    font-weight: 500;
    letter-spacing: .04em;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #efe2e5 18%, #efe2e5 82%, transparent);
    margin: 36px 0;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .16em;
    color: #a08c92;
    margin: 0 0 24px;
    text-align: center;
  }

  .score-list { display: flex; flex-direction: column; gap: 18px; }

  .score-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    margin-bottom: 9px;
    color: #4a3b40;
  }
  .score-name { font-weight: 500; }
  .score-val {
    color: #a08c92;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }

  .score-track {
    height: 8px;
    background: #f6ecee;
    border-radius: 99px;
    overflow: hidden;
  }
  .score-fill {
    height: 100%;
    border-radius: 99px;
    transition: width .95s cubic-bezier(.22,.8,.3,1);
  }

  .tie-note {
    font-size: 13px;
    color: #b08e97;
    text-align: center;
    margin: 22px 0 0;
    line-height: 1.75;
  }

  .advice {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 36px;
  }
  .advice-item {
    background: #fdf8f9;
    border: 1px solid #f6eaed;
    border-radius: 18px;
    padding: 20px 22px;
  }
  .advice-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .16em;
    color: #cf7189;
    margin-bottom: 9px;
  }
  .advice-item p {
    margin: 0;
    font-size: 15px;
    line-height: 1.85;
    color: #5c4c52;
  }

  @media (max-width: 560px) {
    body { padding: 24px 14px; }
    .card { padding: 32px 24px; border-radius: 24px; }
    h1 { font-size: 28px; }
    .q-text { font-size: 20px; }
    .option { padding: 17px 18px; font-size: 15px; }
    .result-hero h2 { font-size: 27px; }
    .result-icon { width: 76px; height: 76px; font-size: 34px; border-radius: 26px; }
    .blob-3 { display: none; }
    .blob-1, .blob-2 { filter: blur(70px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="app">

  <section id="screen-intro" class="screen active">
    <div class="card">
      <div class="eyebrow">情感测试 · 爱的五种语言</div>
      <h1>你真正需要的爱，<br><span class="hl">是哪一种？</span></h1>
      <p class="lead">
        有人靠一句「我爱你」确认被爱，有人靠一个拥抱。<br>
        同样的话，对不同的人有不同的重量。<br>
        20 道二选一，找到你的「爱的语言」。
      </p>
      <button class="btn-primary" id="startBtn">开始测试</button>
      <div class="meta">约 3 分钟 · 20 道二选一 · 无需注册</div>
    </div>
    <p class="credit">改编自 Gary Chapman《爱的五种语言》</p>
  </section>

  <section id="screen-quiz" class="screen">
    <div class="card">
      <div class="quiz-top">
        <button class="back-btn" id="backBtn" aria-label="上一题">←</button>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        <div class="counter" id="counter">1 / 20</div>
      </div>

      <div id="stage">
        <h2 class="q-text" id="qText"></h2>
        <div class="options">
          <button class="option" id="optA">
            <span class="opt-key">A</span>
            <span class="opt-text"></span>
          </button>
          <button class="option" id="optB">
            <span class="opt-key">B</span>
            <span class="opt-text"></span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-result" class="screen">
    <div class="card">
      <div class="result-hero">
        <div class="result-icon" id="resultIcon">💬</div>
        <div class="eyebrow">你的主要爱语</div>
        <h2 id="resultName">肯定的言辞</h2>
        <div class="result-en" id="resultEn">Words of Affirmation</div>
        <p class="tagline" id="resultTagline"></p>
      </div>

      <p class="result-desc" id="resultDesc"></p>
      <div class="chips" id="resultChips"></div>

      <div class="divider"></div>

      <h3 class="section-title">你的五种爱语得分</h3>
      <div class="score-list" id="scoreList"></div>
      <p class="tie-note" id="tieNote" style="display:none"></p>

      <div class="divider"></div>

      <div class="advice">
        <div class="advice-item">
          <span class="advice-label">给 你</span>
          <p id="adviceSelf"></p>
        </div>
        <div class="advice-item">
          <span class="advice-label">给身边的人</span>
          <p id="advicePartner"></p>
        </div>
      </div>

      <button class="btn-primary" id="restartBtn">重新测一次</button>
    </div>
  </section>

</div>

<script>
const LOVE = {
  A: {
    name: '肯定的言辞',
    en: 'Words of Affirmation',
    icon: '💬',
    color: '#e0687f',
    tagline: '一句真心的话，胜过千言万语',
    desc: '你需要用语言来确认自己被爱。一句真诚的「有你在真好」，比任何礼物都更能击中你。反过来，被忽视、被批评的时候，你也比别人更容易受伤。',
    keys: ['被看见', '被肯定', '语言的力量'],
    self: '别不好意思说出你的需要——你完全可以告诉对方：「你夸我的时候，我真的会开心一整天。」',
    partner: '别只把欣赏放在心里。哪怕只是一句「今天辛苦了」，对他/她都意义重大。'
  },
  B: {
    name: '精心的时刻',
    en: 'Quality Time',
    icon: '🌙',
    color: '#e39a3d',
    tagline: '我要的不是「在一起」，是「真正在一起」',
    desc: '你需要的陪伴是有质量的。当对方放下手机、把完整的注意力交给你，你才真正确信自己被珍视。心不在焉的相处，比一个人待着更让你孤单。',
    keys: ['专注', '陪伴', '不被打扰'],
    self: '与其生闷气，不如直接约一个「只有我们两个人」的时间，把需要说清楚。',
    partner: '陪着不等于陪伴。放下手机的那半小时，胜过一整天的同处一室。'
  },
  C: {
    name: '接受礼物',
    en: 'Receiving Gifts',
    icon: '🎁',
    color: '#9b7ae0',
    tagline: '礼物是「我想到你了」的物证',
    desc: '礼物对你是看得见的在意。你在乎的从来不是价格，而是你在某个瞬间被想起、被记挂的证据。一份随手的小东西，可能比贵重礼物更让你心动。',
    keys: ['被记得', '心意', '象征'],
    self: '可以坦然告诉对方，你喜欢被惦记的感觉，而不是一味地说「别乱花钱」。',
    partner: '贵不贵不重要，「看到就想到你」才是重点。'
  },
  D: {
    name: '服务的行动',
    en: 'Acts of Service',
    icon: '🤝',
    color: '#3fa595',
    tagline: '行动，是最扎实的情话',
    desc: '比起甜言蜜语，你更相信有人替你分担的重量。当对方默默把你头疼的事处理掉，你感受到的是最可靠的爱。说得好听却什么都不做，会让你格外失望。',
    keys: ['分担', '可靠', '落到实处'],
    self: '你习惯付出，但也别忘了让对方知道——你也需要被照顾。',
    partner: '别问「需要我做什么」，直接去做，就是最好的表达。'
  },
  E: {
    name: '身体的接触',
    en: 'Physical Touch',
    icon: '🫂',
    color: '#f0806b',
    tagline: '靠近一点，我就安心了',
    desc: '拥抱、牵手、拍拍肩膀——这些触碰是你最直接的安全感来源。一个拥抱能化解你大半的坏情绪；而长期的疏离，会让你强烈怀疑这段关系。',
    keys: ['靠近', '安全感', '温度'],
    self: '想要抱抱就说出来。肢体接触不是矫情，那是你的母语。',
    partner: '出门前的一个拥抱，散步时的一次牵手，成本很低，效果惊人。'
  }
};

const QUESTIONS = [
  { q: '下面哪种情况，更让你感到被爱？',
    a: { t: '对方认真地对我说：「你真的很棒，我很欣赏你。」', k: 'A' },
    b: { t: '对方放下手机，专心陪我聊了一整个晚上。', k: 'B' } },
  { q: '你更希望对方……',
    a: { t: '出差回来，给我带一份小礼物。', k: 'C' },
    b: { t: '在我累的时候，默默把家务都做完。', k: 'D' } },
  { q: '难过的时候，你更需要……',
    a: { t: '一个紧紧的拥抱。', k: 'E' },
    b: { t: '一句温柔的「我懂你」。', k: 'A' } },
  { q: '哪一个会让你心里一暖？',
    a: { t: '对方愿意花一整个周末，只和我待在一起。', k: 'B' },
    b: { t: '对方在我生日时，送了我一直想要的东西。', k: 'C' } },
  { q: '你更看重哪一种在意？',
    a: { t: '对方主动帮我把难搞的事情处理好。', k: 'D' },
    b: { t: '对方在我身边时，会自然地牵起我的手。', k: 'E' } },
  { q: '下面哪种情况，更让你感到被爱？',
    a: { t: '对方写了一段很长的话，告诉我他/她有多在乎我。', k: 'A' },
    b: { t: '对方突然递给我一个小惊喜，说「看到就想到你」。', k: 'C' } },
  { q: '你更想要哪一种相处？',
    a: { t: '我们一起散步，什么也不做，只是聊天。', k: 'B' },
    b: { t: '对方把我一直拖着没修的东西修好了。', k: 'D' } },
  { q: '哪一个更让你觉得被在乎？',
    a: { t: '对方靠在我肩上，安静地待着。', k: 'E' },
    b: { t: '对方记得我提过的小东西，然后买给了我。', k: 'C' } },
  { q: '你更希望听到／看到……',
    a: { t: '对方说「有你在真好」。', k: 'A' },
    b: { t: '对方在我生病时，端来热水和药。', k: 'D' } },
  { q: '哪一个更打动你？',
    a: { t: '对方记得我们之间重要的日子，并认真一起过。', k: 'B' },
    b: { t: '对方在人群里，自然地揽住我的肩。', k: 'E' } },
  { q: '你更希望对方……',
    a: { t: '主动约我出去，把时间完全留给我。', k: 'B' },
    b: { t: '发来一条消息，说「今天也在想你」。', k: 'A' } },
  { q: '哪一个会让你心里一暖？',
    a: { t: '对方注意到我状态不好，主动替我分担。', k: 'D' },
    b: { t: '对方送我一件我随口说过喜欢的东西。', k: 'C' } },
  { q: '你更在意哪一种？',
    a: { t: '对方在朋友面前夸我。', k: 'A' },
    b: { t: '对方在朋友面前自然地搂着我。', k: 'E' } },
  { q: '如果只能选一个……',
    a: { t: '收到一份用心包装的小礼物。', k: 'C' },
    b: { t: '和对方一起做一件小事，比如逛超市。', k: 'B' } },
  { q: '累了一天，你更想要……',
    a: { t: '对方帮我揉揉肩。', k: 'E' },
    b: { t: '对方接过我手里的活。', k: 'D' } },
  { q: '纪念日那天，你更期待……',
    a: { t: '收到一份礼物。', k: 'C' },
    b: { t: '收到一封手写的信。', k: 'A' } },
  { q: '你更希望对方……',
    a: { t: '记得帮我做我讨厌的事。', k: 'D' },
    b: { t: '记得陪我聊我关心的事。', k: 'B' } },
  { q: '哪一个更让你心动？',
    a: { t: '对方送我东西，说「看到就想买给你」。', k: 'C' },
    b: { t: '对方走路时自然牵我的手。', k: 'E' } },
  { q: '你更想要哪一种被对待的方式？',
    a: { t: '对方默默把事情安排妥当，让我省心。', k: 'D' },
    b: { t: '对方认真对我说「谢谢你」。', k: 'A' } },
  { q: '最后，你更想要……',
    a: { t: '一个长长的拥抱。', k: 'E' },
    b: { t: '一段长长的对话。', k: 'B' } }
];

const $ = id => document.getElementById(id);
const SCREENS = ['screen-intro', 'screen-quiz', 'screen-result'];

function show(id) {
  SCREENS.forEach(s => $(s).classList.toggle('active', s === id));
}

function hexToSoft(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},0.12)`;
}

function lighten(hex) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.min(255, Math.round(r + (255 - r) * 0.4));
  g = Math.min(255, Math.round(g + (255 - g) * 0.4));
  b = Math.min(255, Math.round(b + (255 - b) * 0.4));
  return `rgb(${r},${g},${b})`;
}

const MAX_PER = (() => {
  const c = { A: 0, B: 0, C: 0, D: 0, E: 0 };
  QUESTIONS.forEach(q => { c[q.a.k]++; c[q.b.k]++; });
  return Math.max(...Object.values(c));
})();

const TOTAL = QUESTIONS.length;
let current = 0;
let answers = [];
let locked = false;

function replayAnim() {
  const stage = $('stage');
  stage.classList.remove('anim');
  void stage.offsetWidth;
  stage.classList.add('anim');
}

function renderQuestion() {
  const q = QUESTIONS[current];
  $('progressBar').style.width = (current / TOTAL * 100) + '%';
  $('counter').textContent = (current + 1) + ' / ' + TOTAL;
  $('qText').textContent = q.q;
  $('optA').querySelector('.opt-text').textContent = q.a.t;
  $('optB').querySelector('.opt-text').textContent = q.b.t;
  $('backBtn').style.visibility = current === 0 ? 'hidden' : 'visible';
  replayAnim();
}

function startQuiz() {
  current = 0;
  answers = [];
  locked = false;
  show('screen-quiz');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pick(which) {
  if (locked) return;
  locked = true;
  const q = QUESTIONS[current];
  const btn = which === 'a' ? $('optA') : $('optB');
  answers[current] = which === 'a' ? q.a.k : q.b.k;
  btn.classList.add('picked');
  setTimeout(() => {
    btn.classList.remove('picked');
    locked = false;
    current++;
    if (current >= TOTAL) {
      renderResult();
      show('screen-result');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      renderQuestion();
    }
  }, 230);
}

function renderResult() {
  const scores = { A: 0, B: 0, C: 0, D: 0, E: 0 };
  answers.forEach(k => { if (k && scores[k] !== undefined) scores[k]++; });
  const order = ['A', 'B', 'C', 'D', 'E'].sort((x, y) => scores[y] - scores[x]);
  const top = order[0];
  const info = LOVE[top];

  $('resultIcon').textContent = info.icon;
  $('resultIcon').style.background = hexToSoft(info.color);
  $('resultName').textContent = info.name;
  $('resultEn').textContent = info.en;
  $('resultTagline').textContent = info.tagline;
  $('resultDesc').textContent = info.desc;
  $('resultChips').innerHTML = info.keys.map(k =>
    `<span class="chip" style="background:${hexToSoft(info.color)};color:${info.color}">${k}</span>`
  ).join('');
  $('adviceSelf').textContent = info.self;
  $('advicePartner').textContent = info.partner;

  $('scoreList').innerHTML = order.map(k => {
    const it = LOVE[k];
    const pct = Math.round(scores[k] / MAX_PER * 100);
    const w = Math.max(pct, 3);
    return `
      <div class="score-row">
        <div class="score-head">
          <span class="score-name">${it.icon}&nbsp; ${it.name}</span>
          <span class="score-val">${pct}%</span>
        </div>
        <div class="score-track">
          <div class="score-fill" data-w="${w}"
               style="width:0;background:linear-gradient(90deg,${it.color},${lighten(it.color)})"></div>
        </div>
      </div>`;
  }).join('');

  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.score-fill').forEach(f => {
      f.style.width = f.dataset.w + '%';
    });
  }));

  if (scores[order[0]] === scores[order[1]]) {
    $('tieNote').textContent =
      `你的「${LOVE[order[0]].name}」与「${LOVE[order[1]].name}」得分并列，两者对你同样重要。`;
    $('tieNote').style.display = 'block';
  } else {
    $('tieNote').style.display = 'none';
  }
}

$('startBtn').addEventListener('click', startQuiz);
$('optA').addEventListener('click', () => pick('a'));
$('optB').addEventListener('click', () => pick('b'));

$('backBtn').addEventListener('click', () => {
  if (current === 0 || locked) return;
  current--;
  answers.length = current;
  renderQuestion();
});

$('restartBtn').addEventListener('click', startQuiz);

document.addEventListener('keydown', e => {
  if (!$('screen-quiz').classList.contains('active')) return;
  const k = e.key.toLowerCase();
  if (k === 'a' || k === '1') pick('a');
  else if (k === 'b' || k === '2') pick('b');
  else if (e.key === 'ArrowLeft') $('backBtn').click();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>InnerIsland — 成人依恋情感测试（RSQ）</title>
<style>
  :root{
    --pink-50:#FFF6F8; --pink-100:#FDEAEF; --pink-200:#F9D2DD;
    --pink-300:#F4AEC1; --pink-400:#EE85A4; --pink-500:#E3648C;
    --rose-deep:#C24E74; --ink:#5A3A46; --ink-soft:#9A7482;
    --white:#FFFFFF; --gold:#E8B86D;
    --shadow:0 10px 30px rgba(226,100,140,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{
    font-family:"Microsoft YaHei","微软雅黑",-apple-system,"PingFang SC",sans-serif;
    background:linear-gradient(165deg,#FFF9FB 0%,#FDEAF0 45%,#F9DCE6 100%);
    color:var(--ink);
    min-height:100%;
    display:flex;justify-content:center;align-items:flex-start;
    overflow-x:hidden;
  }
  .phone{
    width:100%;max-width:430px;
    min-height:100vh;
    min-height:100dvh;
    position:relative;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#FFF8FA 0%,#FDEDF2 100%);
  }
  .topbar{
    padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 10px;
    display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:9px;}
  .brand .logo{
    width:34px;height:34px;border-radius:12px;
    background:linear-gradient(135deg,var(--pink-400),var(--rose-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(226,100,140,.35);
    flex-shrink:0;
  }
  .brand .logo svg{width:20px;height:20px;}
  .brand .name{
    display:flex;flex-direction:column;justify-content:center;line-height:1.1;
  }
  .brand .name .brand-main{
    font-size:18px;font-weight:700;letter-spacing:.5px;color:var(--rose-deep);
  }
  .brand .name .brand-sub{
    font-size:10px;font-weight:400;color:#C0C0C0;letter-spacing:1px;margin-top:2px;
  }
  .topbar .heart{font-size:13px;color:var(--pink-400);background:var(--white);padding:6px 12px;border-radius:99px;box-shadow:var(--shadow);font-weight:600;}

  .screen{display:none;flex:1;flex-direction:column;min-width:0;
    padding:10px 22px calc(env(safe-area-inset-bottom,0px) + 24px);
    animation:fadeUp .45s ease both;}
  .screen.active{display:flex;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideIn{from{opacity:0;transform:translateX(36px);}to{opacity:1;transform:translateX(0);}}
  @keyframes slideInL{from{opacity:0;transform:translateX(-36px);}to{opacity:1;transform:translateX(0);}}

  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12px 4px;}
  .hero-illu{width:230px;max-width:62vw;margin-bottom:6px;flex-shrink:0;}
  .hero h1{font-size:30px;line-height:1.35;color:var(--ink);font-weight:700;}
  .hero h1 em{font-style:normal;background:linear-gradient(120deg,var(--pink-500),var(--rose-deep));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero .sub{margin-top:12px;font-size:13.5px;color:var(--ink-soft);line-height:1.9;}
  .hero .tags{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;justify-content:center;}
  .hero .tags span{font-size:11.5px;background:var(--white);color:var(--rose-deep);padding:7px 13px;border-radius:99px;box-shadow:var(--shadow);font-weight:600;}
  .btn{
    border:none;cursor:pointer;font-family:inherit;
    border-radius:99px;font-weight:700;letter-spacing:1px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .2s;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{
    background:linear-gradient(120deg,var(--pink-400),var(--rose-deep));color:#fff;
    padding:16px 66px;font-size:16px;box-shadow:0 12px 26px rgba(226,100,140,.4);
  }
  .btn-ghost{background:var(--white);color:var(--rose-deep);padding:14px 0;font-size:14px;box-shadow:var(--shadow);width:100%;}
  .start-wrap{margin-top:30px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .note{font-size:10.5px;color:#BB97A4;margin-top:6px;line-height:1.8;}

  .progress-zone{padding:6px 0 2px;flex-shrink:0;}
  .progress-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-meta .qnum{font-size:13px;color:var(--ink-soft);font-weight:600;}
  .progress-meta .qnum b{color:var(--rose-deep);font-size:16px;}
  .progress-meta .hint{font-size:11px;color:#C6A3B0;}
  .progress-track{height:7px;background:var(--pink-200);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--pink-300),var(--pink-500));transition:width .4s cubic-bezier(.4,0,.2,1);}

  .qcard{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    background:var(--white);border-radius:26px;box-shadow:var(--shadow);
    padding:30px 24px;margin-top:16px;
  }
  .qcard.enter-r{animation:slideIn .35s ease both;}
  .qcard.enter-l{animation:slideInL .35s ease both;}
  .q-label{font-size:11px;color:var(--pink-400);font-weight:700;letter-spacing:3px;margin-bottom:14px;}
  .q-text{font-size:18.5px;line-height:1.75;font-weight:600;min-height:96px;}

  .opts{display:flex;flex-direction:column;gap:10px;margin-top:26px;}
  .opt{
    display:flex;align-items:center;gap:12px;
    background:var(--pink-50);border:1.5px solid transparent;border-radius:16px;
    padding:13px 16px;cursor:pointer;font-size:14.5px;color:var(--ink);
    transition:background .18s ease, border-color .18s ease, color .18s ease, transform .12s ease;
    text-align:left;font-family:inherit;width:100%;
    -webkit-user-select:none;user-select:none;
  }
  .opt:active{transform:scale(.985);}
  .opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--pink-300);flex-shrink:0;transition:border-color .18s, background .18s, box-shadow .18s;position:relative;}
  .opt.sel{background:linear-gradient(120deg,#FDE3EB,#FAD4E0);border-color:var(--pink-400);color:var(--rose-deep);font-weight:700;}
  .opt.sel .dot{border-color:var(--pink-500);background:var(--pink-500);box-shadow:0 0 0 4px rgba(227,100,140,.18);}

  .nav{display:flex;gap:12px;margin-top:20px;flex-shrink:0;}
  .nav .btn-prev{
    background:var(--white);color:var(--rose-deep);padding:15px 0;font-size:14.5px;
    box-shadow:var(--shadow);flex:0 0 108px;
  }
  .nav .btn-next{
    flex:1;padding:15px 0;font-size:15px;color:#fff;
    background:linear-gradient(120deg,var(--pink-400),var(--rose-deep));
    box-shadow:0 10px 22px rgba(226,100,140,.38);
  }
  .nav .btn-next:disabled{opacity:.35;box-shadow:none;cursor:not-allowed;}

  .result-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:8px;}
  .res-banner{
    background:linear-gradient(135deg,var(--pink-400),var(--rose-deep));
    border-radius:26px;padding:30px 24px;color:#fff;text-align:center;
    box-shadow:0 14px 30px rgba(194,78,116,.35);position:relative;overflow:hidden;
  }
  .res-banner::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12);top:-70px;right:-50px;}
  .res-banner::before{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1);bottom:-50px;left:-30px;}
  .res-banner .rb-label{font-size:11px;letter-spacing:4px;opacity:.85;font-weight:600;}
  .res-banner .rb-type{font-size:30px;font-weight:800;margin:10px 0 6px;position:relative;z-index:1;}
  .res-banner .rb-en{font-size:12px;letter-spacing:3px;opacity:.8;position:relative;z-index:1;}
  .res-banner .rb-desc{margin-top:14px;font-size:13px;line-height:1.9;opacity:.95;position:relative;z-index:1;text-align:left;background:rgba(255,255,255,.14);border-radius:16px;padding:14px 16px;}

  .sec-title{display:flex;align-items:center;gap:10px;margin:26px 2px 14px;font-size:16px;font-weight:700;color:var(--ink);}
  .sec-title::before{content:"";width:5px;height:18px;border-radius:4px;background:linear-gradient(180deg,var(--pink-400),var(--rose-deep));}

  .bars-card{background:var(--white);border-radius:22px;box-shadow:var(--shadow);padding:22px 20px;}
  .bar-row{margin-bottom:18px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
  .bar-head .t{font-size:14px;font-weight:700;}
  .bar-head .t small{font-size:10px;color:var(--ink-soft);font-weight:400;margin-left:5px;letter-spacing:.5px;}
  .bar-head .v{font-size:13px;font-weight:800;color:var(--rose-deep);}
  .bar-track{height:12px;background:var(--pink-100);border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;width:0;border-radius:99px;transition:width 1s cubic-bezier(.3,0,.2,1) .2s;}
  .bar-row.primary .bar-head .t{color:var(--rose-deep);}
  .bar-row.primary .bar-head .t::after{content:" · 主导";font-size:10px;background:linear-gradient(120deg,var(--pink-400),var(--rose-deep));color:#fff;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px;}

  .model-card{display:flex;gap:12px;}
  .model-item{flex:1;min-width:0;background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:18px 14px;text-align:center;}
  .model-item .mi-t{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .model-item .mi-v{font-size:20px;font-weight:800;margin-top:6px;}
  .model-item .mi-s{font-size:10.5px;margin-top:5px;color:var(--ink-soft);line-height:1.6;}

  .type-card{background:var(--white);border-radius:22px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px;border-left:5px solid var(--pink-300);}
  .type-card.is-primary{border-left-color:var(--rose-deep);background:linear-gradient(120deg,#FFF5F8,#FDEAF1);}
  .type-card .tc-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .type-card .tc-head .n{font-size:16px;font-weight:800;color:var(--rose-deep);}
  .type-card .tc-head .e{font-size:10px;letter-spacing:1.5px;color:var(--ink-soft);}
  .type-card .tc-score{margin-left:auto;font-size:12px;font-weight:800;color:var(--pink-500);background:var(--pink-100);padding:4px 11px;border-radius:99px;flex-shrink:0;}
  .type-card p{font-size:13px;line-height:1.9;color:var(--ink);margin-top:10px;}

  .ref-card{background:rgba(255,255,255,.7);border:1px dashed var(--pink-300);border-radius:18px;padding:16px;font-size:11px;line-height:1.9;color:var(--ink-soft);}
  .ref-card b{color:var(--rose-deep);}
  .res-actions{margin-top:22px;display:flex;flex-direction:column;gap:12px;}
  .result-scroll::-webkit-scrollbar{display:none;}

  @media (max-height: 820px){
    .hero-illu{width:170px;}
    .hero h1{font-size:26px;}
    .hero .sub{margin-top:9px;font-size:12.5px;line-height:1.75;}
    .hero .tags{margin-top:14px;}
    .start-wrap{margin-top:18px;}
    .btn-primary{padding:14px 56px;font-size:15px;}
    .qcard{padding:24px 20px;}
    .q-text{font-size:17px;min-height:80px;}
    .opts{margin-top:18px;gap:8px;}
    .opt{padding:11px 14px;font-size:14px;}
  }
  @media (max-height: 680px){
    .hero-illu{width:120px;}
    .hero h1{font-size:22px;}
    .hero .sub{font-size:11.5px;}
    .hero .tags span{font-size:10.5px;padding:5px 10px;}
    .note{font-size:9.5px;}
    .start-wrap{margin-top:12px;}
    .btn-primary{padding:12px 48px;font-size:14px;}
    .qcard{padding:20px 18px;margin-top:10px;}
    .q-label{margin-bottom:8px;}
    .q-text{font-size:16px;min-height:64px;}
    .opts{margin-top:14px;gap:7px;}
    .opt{padding:10px 13px;font-size:13.5px;}
    .nav{margin-top:14px;}
    .nav .btn-prev,.nav .btn-next{padding:13px 0;}
  }
  @media (max-width: 360px){
    .model-card{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="phone">

  <div class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 21C12 21 4 15.5 4 9.8C4 6.6 6.4 4.5 9 4.5C10.4 4.5 11.4 5.2 12 6.1C12.6 5.2 13.6 4.5 15 4.5C17.6 4.5 20 6.6 20 9.8C20 15.5 12 21 12 21Z" fill="white"/></svg>
      </div>
      <div class="name">
        <span class="brand-main">INNERISLAND</span>
        <span class="brand-sub">@小红书</span>
      </div>
    </div>
    <div class="heart">依恋情感测试</div>
  </div>

  <section id="screen-intro" class="screen active">
    <div class="hero">
      <svg class="hero-illu" viewBox="0 0 230 170" fill="none">
        <ellipse cx="115" cy="150" rx="95" ry="12" fill="#F9D2DD"/>
        <path d="M40 150C40 100 70 55 115 55C160 55 190 100 190 150" fill="#FDEAEF"/>
        <path d="M55 150C55 108 80 70 115 70C150 70 175 108 175 150" fill="#F9D2DD" opacity=".6"/>
        <path d="M115 128C115 128 88 110 88 92C88 82.6 95.2 76 103 76C107.6 76 111.6 78.4 115 82.4C118.4 78.4 122.4 76 127 76C134.8 76 142 82.6 142 92C142 110 115 128 115 128Z" fill="#E3648C"/>
        <circle cx="52" cy="48" r="5" fill="#F4AEC1"/><circle cx="182" cy="38" r="7" fill="#F9D2DD"/>
        <circle cx="195" cy="72" r="4" fill="#F4AEC1"/><circle cx="35" cy="80" r="4" fill="#F9D2DD"/>
        <path d="M75 30C75 30 70 22 75 17C80 22 75 30 75 30Z" fill="#F4AEC1"/>

      <h1>读懂你在爱里的<br><em>依恋模样</em></h1>
      <p class="sub">30 道题，约 5 分钟<br>依据国际通用成人依恋量表 RSQ 编制<br>看见自己，是靠近幸福的第一步</p>
      <div class="tags">
        <span>30 题 · 5 点计分</span><span>四维依恋画像</span><span>专业理论依据</span>
      </div>
      <div class="start-wrap">
        <button class="btn btn-primary" onclick="startTest()">开始测试</button>
        <p class="note">本测试基于 RSQ（Relationship Scales Questionnaire，Griffin &amp; Bartholomew, 1994）中文版改编<br>仅供自我探索与参考，不构成临床心理诊断</p>
      </div>

  <section id="screen-quiz" class="screen">
    <div class="progress-zone">
      <div class="progress-meta">
        <div class="qnum">第 <b id="qNow">1</b> / 30 题</div>

      <div class="progress-track"><div class="progress-fill" id="pFill"></div></div>
    </div>
    <div class="qcard" id="qCard">
      <div class="q-label">以下描述在多大程度上符合你？</div>
      <div class="q-text" id="qText"></div>
      <div class="opts" id="optBox"></div>
    </div>
    <div class="nav">
      <button class="btn btn-prev" id="btnPrev" onclick="goPrev()">‹ 上一题</button>

  </section>

<script>
/* ============ RSQ 30 题（Griffin & Bartholomew, 1994）中文版 ============ */
const ITEMS = [
  "我觉得很难去依赖别人。",
  "对我而言，保持独立感十分重要。",
  "我很容易与他人在情感上变得亲近。",
  "我希望能和另一个人完全融为一体。",
  "我担心，如果放任自己和别人走得太近，我会受到伤害。",
  "就算没有亲密的情感关系，我也觉得自在。",
  "我无法确信，在我需要的时候，别人总会陪在我身边。",
  "我渴望与他人达到完全的情感亲密。",
  "我会害怕孤身一人。",
  "去依赖别人，我会觉得心安。",
  "我常常担心，恋爱伴侣并不是真的爱我。",
  "我很难完全信任他人。",
  "我会担心别人和我靠得太近。",
  "我想要拥有情感上亲密的关系。",
  "别人依赖我，我可以坦然接受。",
  "我担心，我看重别人的程度，远超过对方看重我。",
  "人总是会在你需要的时候不在场。",
  "我想要和对方完全融为一体的渴望，有时会把别人吓跑。",
  "能够自给自足，对我来说非常重要。",
  "一旦有人和我过于亲近，我就会感到紧张不安。",
  "我常常担心恋爱伴侣不愿意继续和我在一起。",
  "我不太情愿让别人来依赖我。",
  "我害怕自己会被抛弃。",
  "和别人亲近相处，我多少会觉得不自在。",
  "我发现，别人并不愿意达到我所期待的亲密程度。",
  "我倾向于不去依赖其他人。",
  "我相信，当我需要时，别人会陪伴在我身旁。",
  "我会担心得不到他人的接纳。",
  "恋爱伴侣常常希望我更加亲密，但这超出了我觉得舒适的范围。",
  "对我来说，和别人变得亲近还算容易。"
];
const SCALE_LABELS = ["完全不像我","不太像我","有点像我","比较像我","非常像我"];

/*
 * 原始计分（Griffin & Bartholomew, 1994）：
 *   Secure:      items 3, 9(R), 10, 15, 28(R)
 *   Dismissing:  items 2, 6, 19, 22, 26
 *   Preoccupied: items 6(R), 8, 16, 25
 *   Fearful:     items 1, 5, 12, 24
 *   (R) = 反向计分（6 - 原始分）
 * 注意：第 26 题属于疏离型，第 28 题属于安全型，不要混淆。
 */
const SCALES = {
  secure:      { name:"安全型",   en:"SECURE",      items:[3,9,10,15,28], rev:[9,28],
    short:"你能同时信任自己与爱人。亲密不会让你不安，独立也不会让你惶恐；你在关系中收放自如，是被爱滋养出的从容。",
    desc:"安全型依恋者对自我与他人都持有积极看法：他们相信自己的价值，也相信伴侣在需要时会给予回应。他们既能享受亲密，也能舒适地独处；面对矛盾时倾向直接沟通而非逃避或纠缠。研究表明，安全型与更高的关系满意度、更强的情绪调节能力相关。这是四种类型中最有利于关系健康的依恋模式。" },
  dismissing:  { name:"疏离型",   en:"DISMISSING",  items:[2,6,19,22,26], rev:[],
    short:"你习惯独自消化情绪，把「不依赖任何人」当作铠甲。独立是你的骄傲，却也可能让想靠近你的人望而却步。",
    desc:"疏离型（又称轻视型）依恋者对自我持积极看法、对他人持消极看法：他们高度强调独立与自给自足，倾向压抑或否认依恋需求，不喜欢别人依赖自己，也较少主动寻求支持。这往往是一种自我保护——与其面临失望，不如先保持距离。若能尝试适度示弱、允许他人进入自己的世界，关系会意想不到地回温。" },
  preoccupied: { name:"痴迷型",   en:"PREOCCUPIED", items:[6,8,16,25],    rev:[6],
    short:"你在爱里容易患得患失，对方的一句话能让你回味或失落很久。你爱得热烈，也渴望被同等热烈地爱着。",
    desc:"痴迷型（又称焦虑型）依恋者对自我持消极看法、对他人持积极看法：他们渴望亲密却又担心自己不够好、不值得被爱，容易过度在意伴侣的回应，把细小的冷淡解读为拒绝的信号。情绪随关系起伏较大，有时会因害怕失去而紧抓对方，反而把彼此推远。练习自我肯定、建立关系之外的支点，能帮你爱得松弛。" },
  fearful:     { name:"恐惧型",   en:"FEARFUL",     items:[1,5,12,24],    rev:[],
    short:"你渴望亲密，又惧怕亲密。心里那扇门虚掩着——想被人走进去，又担心走进去的人会伤害你。",
    desc:"恐惧型（又称恐惧-回避型）依恋者对自我与他人都持消极看法：他们内心渴望亲密，却因害怕被拒绝、被伤害而在关键时刻退缩，常常在「靠近」与「逃离」之间摇摆。这种矛盾并不软弱，而是曾经受过伤的谨慎。逐步建立安全的信任体验——从低风险的小事开始交付真心——能帮助恐惧型慢慢卸下防备。" }
};

let answers = new Array(30).fill(null);
let cur = 0;

const $ = id => document.getElementById(id);

function startTest(){
  window.scrollTo(0, 0);
  $("screen-intro").classList.remove("active");
  $("screen-quiz").classList.add("active");
  renderQ(0, "enter-r");
}

function renderQ(i, dir){
  cur = i;
  $("qNow").textContent = i + 1;
  $("pFill").style.width = (i / 30 * 100) + "%";

  const card = $("qCard");
  card.classList.remove("enter-r", "enter-l");
  void card.offsetWidth;
  if(dir) card.classList.add(dir);

  $("qText").textContent = ITEMS[i];
  buildOpts(i);

  $("btnPrev").style.visibility = i === 0 ? "hidden" : "visible";
  $("btnNext").disabled = answers[i] === null;
  $("btnNext").textContent = i === 29 ? "查看结果 ♥" : "下一题 ›";
}

function buildOpts(i){
  const box = $("optBox");
  box.innerHTML = "";
  SCALE_LABELS.forEach((lab, idx) => {
    const v = idx + 1;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (answers[i] === v ? " sel" : "");
    b.innerHTML = '<span class="dot"></span><span>' + lab + '</span>';
    b.onclick = () => pick(i, v);
    box.appendChild(b);
  });
}

function pick(i, v){
  if(i !== cur) return;
  answers[i] = v;
  const opts = $("optBox").children;
  for(let k = 0; k < opts.length; k++){
    opts[k].classList.toggle("sel", k + 1 === v);
  }
  $("btnNext").disabled = false;
}

function goPrev(){
  if(cur > 0){
    renderQ(cur - 1, "enter-l");
    window.scrollTo(0, 0);
  }
}
function goNext(){
  if(answers[cur] === null) return;
  if(cur < 29){
    renderQ(cur + 1, "enter-r");
    window.scrollTo(0, 0);
  }else{
    $("pFill").style.width = "100%";
    showResult();
  }
}

function score(sc){
  let sum = 0;
  sc.items.forEach(n => {
    let v = answers[n - 1];
    if(sc.rev.includes(n)) v = 6 - v;
    sum += v;
  });
  return sum / sc.items.length;
}

function showResult(){
  $("screen-quiz").classList.remove("active");
  const r = $("screen-result");
  r.classList.add("active");
  window.scrollTo(0, 0);

  const s = { secure:score(SCALES.secure), dismissing:score(SCALES.dismissing),
              preoccupied:score(SCALES.preoccupied), fearful:score(SCALES.fearful) };
  const order = Object.keys(s).sort((a,b)=> s[b]-s[a]);
  const top = order[0];
  const pct = v => Math.round((v - 1) / 4 * 100);
  const selfM  = (s.secure + s.dismissing) - (s.fearful + s.preoccupied);
  const otherM = (s.secure + s.preoccupied) - (s.fearful + s.dismissing);
  const mTxt = v => v >= 0 ? "偏积极" : "偏消极";
  const mColor = v => v >= 0 ? "#E3648C" : "#B08A97";

  const barColor = { secure:"linear-gradient(90deg,#F4AEC1,#E3648C)",
    dismissing:"linear-gradient(90deg,#F9C58B,#E8975A)",
    preoccupied:"linear-gradient(90deg,#C9A8F0,#9B7BD8)",
    fearful:"linear-gradient(90deg,#9CC3EE,#5E93D6)" };

  const barsHtml = order.map(k => `
    <div class="bar-row ${k===top?'primary':''}">
      <div class="bar-head"><div class="t">${SCALES[k].name}<small>${SCALES[k].en}</small></div>
      <div class="v">${s[k].toFixed(2)} 分 · ${pct(s[k])}%</div></div>
      <div class="bar-track"><div class="bar-fill" data-w="${pct(s[k])}" style="background:${barColor[k]}"></div></div>
    </div>`).join("");

  const typesHtml = order.map(k => `
    <div class="type-card ${k===top?'is-primary':''}">
      <div class="tc-head"><span class="n">${SCALES[k].name}</span><span class="e">${SCALES[k].en}</span>
        <span class="tc-score">${s[k].toFixed(2)} 分</span></div>
      <p>${SCALES[k].desc}</p>
    </div>`).join("");

  $("resScroll").innerHTML = `
    <div class="res-banner">
      <div class="rb-label">你的主导依恋类型</div>
      <div class="rb-type">${SCALES[top].name}</div>
      <div class="rb-en">${SCALES[top].en} ATTACHMENT</div>
      <div class="rb-desc">${SCALES[top].short}</div>
    </div>

    <div class="sec-title">四维依恋画像</div>
    <div class="bars-card">${barsHtml}</div>

    <div class="sec-title">内在工作模型</div>
    <div class="model-card">
      <div class="model-item"><div class="mi-t">自我模型</div>
        <div class="mi-v" style="color:${mColor(selfM)}">${selfM.toFixed(1)} · ${mTxt(selfM)}</div>
        <div class="mi-s">我是否值得被爱、被接纳</div></div>
      <div class="model-item"><div class="mi-t">他人模型</div>
        <div class="mi-v" style="color:${mColor(otherM)}">${otherM.toFixed(1)} · ${mTxt(otherM)}</div>
        <div class="mi-s">他人是否可靠、愿意回应我</div></div>
    </div>
    <p class="note" style="margin-top:10px;">自我模型 = (安全+疏离) − (恐惧+痴迷)；他人模型 = (安全+痴迷) − (恐惧+疏离)。正值越大，代表该模型越积极。</p>

    <div class="sec-title">四种依恋类型全览</div>
    ${typesHtml}

    <div class="sec-title">测试来源与依据</div>
    <div class="ref-card">
      <b>量表来源：</b>本测试改编自《关系量表问卷》（Relationship Scales Questionnaire, RSQ），由 Griffin 与 Bartholomew 于 1994 年发表（Griffin, D. W., &amp; Bartholomew, K. (1994). <i>Models of the self and other: Fundamental dimensions underlying measures of adult attachment. Journal of Personality and Social Psychology, 67</i>(3), 430–445）。<br>
      <b>理论依据：</b>RSQ 共 30 题，题目取自 Hazan &amp; Shaver (1987) 成人依恋测量、Bartholomew &amp; Horowitz (1991) 人际关系问卷（RQ）与 Collins &amp; Read (1990) 成人依恋量表，基于 Bartholomew 的四类型依恋模型：由「自我模型」与「他人模型」的正负组合，划分出安全型、疏离型、痴迷型与恐惧型。<br>
      <b>计分方式：</b>每题按 1–5 分评定。安全型取第 3、9、10、15、28 题均分（第 9、28 题反向计分）；疏离型取第 2、6、19、22、26 题均分；痴迷型取第 6、8、16、25 题均分（第 6 题反向计分）；恐惧型取第 1、5、12、24 题均分。四种类型为连续维度得分，得分最高者为主导类型。<br>
      <b>温馨提示：</b>依恋风格会随经历与成长缓慢变化，测试结果反映的是当下的你。本测试仅供自我探索参考，不构成临床心理诊断；如有持续困扰，建议寻求专业心理咨询。
    </div>

    <div class="res-actions">
      <button class="btn btn-primary" style="padding:15px 0;width:100%;" onclick="restart()">重新测试一次</button>
      <button class="btn btn-ghost" onclick="backHome()">返回首页</button>
    </div>`;

  setTimeout(()=>document.querySelectorAll(".bar-fill").forEach(el => el.style.width = el.dataset.w + "%"), 80);
}

function restart(){
  answers = new Array(30).fill(null);
  $("screen-result").classList.remove("active");
  $("screen-quiz").classList.add("active");
  renderQ(0, "enter-r");
  window.scrollTo(0, 0);
}
function backHome(){
  answers = new Array(30).fill(null);
  $("pFill").style.width = "0%";
  $("screen-result").classList.remove("active");
  $("screen-intro").classList.add("active");
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
